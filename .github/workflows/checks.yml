name: ARC checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r lib/backend/requirements.lock
      - run: python -m pip install ruff==0.17.3
      - run: ruff check lib/backend services tools
      - run: ruff format --check lib/backend services tools
      - run: python tools/check_source_secrets.py
      - run: python -m unittest discover -s tools -p 'test_*.py' -q
      - run: python -m unittest discover -s lib/backend -p 'test_*.py' -q
        env:
          PYTHON_DOTENV_DISABLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the verified Flutter SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: flutter/flutter
          ref: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1 # Flutter 3.47.5
          fetch-depth: 0 # Flutter derives its SDK version from Git tags.
          path: .flutter-sdk
          persist-credentials: false
      - run: echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: node --test test/arc_intro_test.cjs test/arc_startup_test.cjs
      - run: flutter build web --release --no-pub --no-web-resources-cdn
